name: ci
on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt

      # The agent itself: fit/predict, decision logging, no test-fold leak,
      # and that a seed change actually changes the agent.  No network.
      - name: agent
        run: PYTHONPATH=. python tests/test_agent.py

      # Clause 3 is faked by branching on dataset identity; this searches the
      # package for the registered task ids and dataset names.
      - name: no dataset-specific logic
        run: PYTHONPATH=. python tests/test_no_dataset_specific_logic.py

      # The verdict must be derived, and an unmeasured task must read
      # [not measured] rather than vanish from the table.
      - name: report and verdict
        run: PYTHONPATH=. python tests/test_report.py

      # The committed registry must still match the rule that produced it, and
      # RESULTS.md must still match what report.py generates from runs/*.json --
      # so a stale document cannot go green.
      - name: registry and report are not stale
        run: PYTHONPATH=. python tests/test_registry_frozen.py
