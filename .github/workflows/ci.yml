name: ci
on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      # Both of these turn a *local* deferral into a CI failure.
      #
      # ADS_REQUIRE_FRESH_RESULTS: the RESULTS.md freshness check defers while
      # a benchmark is in flight, because run files land continuously and any
      # snapshot is stale a fold later. A clean checkout has nothing running,
      # so a deferral here means the deferral logic itself is broken.
      #
      # ADS_REQUIRE_EXTERNAL_PROBE: the evaluation cache must have been
      # spot-checked against OpenML itself, not merely committed with a
      # --offline provenance run.
      ADS_REQUIRE_FRESH_RESULTS: "1"
      ADS_REQUIRE_EXTERNAL_PROBE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt

      # Every tests/test_*.py, discovered rather than listed.
      #
      # This used to be one step per file, and on 2026-09-10 that turned out to
      # be running 5 of 9: `test_escalation_gate.py` -- the file that asserts
      # the gate deciding clause 2 -- was never in CI at all, along with the
      # seed-accounting, atomic-write and registry-committed tests. A list of
      # steps is a list someone has to remember to extend, and the same shape
      # of omission (CI green on a document no CI step regenerated) is already
      # in this repo's history. So: discovery, with an explicit floor on the
      # count so that a glob that silently matches nothing cannot pass either.
      - name: every test in tests/
        run: |
          set -uo pipefail
          shopt -s nullglob
          files=(tests/test_*.py)
          echo "discovered ${#files[@]} test files"
          if [ "${#files[@]}" -lt 11 ]; then
            echo "expected at least 11 test files, found ${#files[@]}" >&2
            exit 1
          fi
          rc=0
          for f in "${files[@]}"; do
            echo "::group::$f"
            if ! python "$f"; then
              echo "FAILED: $f" >&2
              rc=1
            fi
            echo "::endgroup::"
          done
          exit $rc
